<svg class="viz" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="gpu-memory-t gpu-memory-d" font-size="12">
<title id="gpu-memory-t">GPU memory of the reconstructor grows linearly with frames</title>
<desc id="gpu-memory-d">Measured 7.4 GiB at 24 frames and 13.8 GiB at 48 frames. A linear fit, about 1 GiB plus 0.27 GiB per frame, predicts about 22 GiB at 80 frames, above the roughly 19 GiB that were available, so 80 frames were not run.</desc>
<style>
svg.viz { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.bg { fill: #fcfcfb; }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.sub { fill: #52514e; font-size: 12.5px; }
.tick { fill: #898781; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.label { fill: #0b0b0b; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.label-2 { fill: #52514e; font-size: 12px; }
.note { fill: #898781; font-size: 11.5px; }
.grid { stroke: #e1e0d9; stroke-width: 1; }
.axis { stroke: #c3c2b7; stroke-width: 1; }
.ref { stroke: #898781; stroke-width: 1.5; stroke-dasharray: 4 4; }
.s1 { fill: #2a78d6; }
.s2 { fill: #eb6834; }
.line-s1 { stroke: #2a78d6; stroke-width: 2; fill: none; }
.line-est { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.dot-est { fill: #fcfcfb; stroke: #2a78d6; stroke-width: 2; }
.mark:hover { opacity: 0.85; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .title, .label { fill: #ffffff; }
  .sub, .label-2 { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .s1 { fill: #3987e5; }
  .s2 { fill: #d95926; }
  .line-s1, .line-est { stroke: #3987e5; }
  .dot-est { fill: #1a1a19; stroke: #3987e5; }
}
</style>
<rect class="bg" x="0" y="0" width="720" height="360" rx="12"/>
<text class="title" x="24" y="28">GPU memory of the reconstructor grows linearly with frames</text>
<text class="sub" x="24" y="47">VGGT-1B, measured on two frame budgets; the 80-frame point is an estimate</text>
<line class="grid" x1="64" x2="692" y1="304.0" y2="304.0"/>
<text class="tick" x="56" y="308.0" text-anchor="end">0</text>
<line class="grid" x1="64" x2="692" y1="246.5" y2="246.5"/>
<text class="tick" x="56" y="250.5" text-anchor="end">6</text>
<line class="grid" x1="64" x2="692" y1="189.0" y2="189.0"/>
<text class="tick" x="56" y="193.0" text-anchor="end">12</text>
<line class="grid" x1="64" x2="692" y1="131.5" y2="131.5"/>
<text class="tick" x="56" y="135.5" text-anchor="end">18</text>
<line class="grid" x1="64" x2="692" y1="74.0" y2="74.0"/>
<text class="tick" x="56" y="78.0" text-anchor="end">24</text>
<text class="tick" x="64.0" y="322" text-anchor="middle">0</text>
<text class="tick" x="235.3" y="322" text-anchor="middle">24</text>
<text class="tick" x="406.5" y="322" text-anchor="middle">48</text>
<text class="tick" x="634.9" y="322" text-anchor="middle">80</text>
<line class="axis" x1="64" x2="692" y1="304" y2="304"/>
<text class="note" x="692" y="342" text-anchor="end">frames</text>
<text class="note" x="56" y="60" text-anchor="end">GiB</text>
<line class="ref" x1="64" x2="692" y1="121.9" y2="121.9"/>
<text class="label-2" x="70" y="114.9">available during the runs ≈ 19 GiB</text>
<polyline class="line-s1" points="235.3,233.1 406.5,171.8"/>
<polyline class="line-est" points="406.5,171.8 634.9,90.3"/>
<circle class="mark s1" cx="235.3" cy="233.1" r="5"><title>24 frames: 7.4 GiB (measured)</title></circle>
<text class="label" x="245.3" y="249.1">7.4 GiB</text>
<circle class="mark s1" cx="406.5" cy="171.8" r="5"><title>48 frames: 13.8 GiB (measured)</title></circle>
<text class="label" x="416.5" y="187.8">13.8 GiB</text>
<circle class="mark dot-est" cx="634.9" cy="90.3" r="5"><title>80 frames: ≈ 22.3 GiB (extrapolated, not run)</title></circle>
<text class="label" x="624.9" y="78.3" text-anchor="end">≈ 22.3 GiB · estimate, not run</text>
<text class="note" x="64" y="350">≈ 1 GiB + 0.27 GiB per frame · NVIDIA RTX 5090, 32 GB · solid = measured, dashed = extrapolated</text>
</svg>
